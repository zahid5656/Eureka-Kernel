name: Build A205 Kernel (Standalone)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ARCH: arm64

    steps:
      # -----------------------------
      # 📥 Checkout source
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 🧰 Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex zip curl \
            libssl-dev libncurses5-dev \
            libncursesw5-dev unzip python3

      # -----------------------------
      # 🔧 Clone Proton Clang 14
      # -----------------------------
      - name: Setup toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          echo "PATH=$(pwd)/toolchain/bin:$PATH" >> $GITHUB_ENV

      # -----------------------------
      # ⚙️ Kernel config (A205)
      # -----------------------------
      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a20_defconfig

      # -----------------------------
      # 🏗️ Build kernel
      # -----------------------------
      - name: Build kernel
        run: |
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # -----------------------------
      # 📦 Prepare AnyKernel3
      # -----------------------------
      - name: Prepare AnyKernel
        run: |
          mkdir -p AnyKernel

          # Copy your AnyKernel3 base files
          cp -r kernel_zip/anykernel/* AnyKernel/

          # Copy compiled images
          cp out/arch/arm64/boot/Image AnyKernel/
          cp out/arch/arm64/boot/dtb.img AnyKernel/ || true

          # Use prebuilt dtbo (A205)
          cp kernel_zip/dtbo/a20/dtbo.img AnyKernel/dtbo.img || true

      # -----------------------------
      # 🗜️ Create flashable zip
      # -----------------------------
      - name: Build AnyKernel zip
        run: |
          cd AnyKernel
          ZIPNAME="A205-Kernel-$(date +%Y%m%d).zip"

          zip -r9 $ZIPNAME * -x "*.git*" "*.github*"

          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      # -----------------------------
      # 📤 Move output
      # -----------------------------
      - name: Collect zip
        run: |
          mkdir -p output
          cp AnyKernel/${ZIPNAME} output/

      # -----------------------------
      # ⬆️ Upload artifact
      # -----------------------------
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: A205-Kernel
          path: output/*
